<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>External Monitor Portfolio</title>
<style>
:root{--red:#e00;--ink:#151515;--muted:#667085;--line:#e5e7eb;--bg:#f4f5f7}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink)}header{background:#151515;color:#fff;padding:18px 28px}header h1{margin:0;font-size:22px}nav{background:#fff;border-bottom:1px solid var(--line);padding:0 28px;display:flex;gap:22px}nav button{border:0;background:none;padding:16px 2px;font-weight:700;color:#667085;cursor:pointer;border-bottom:3px solid transparent}nav button.active{color:#151515;border-color:var(--red)}main{max-width:1400px;margin:24px auto;padding:0 24px}.view{display:none}.view.active{display:block}.toolbar,.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:18px}.toolbar{display:flex;gap:16px;align-items:end}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;font-weight:700;color:var(--muted)}select{min-width:250px;padding:10px;border:1px solid #d0d5dd;border-radius:8px}.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}.kpi small{display:block;color:var(--muted);font-weight:700;margin-bottom:8px}.kpi strong{font-size:28px}.summary{background:#fff7ed;border:1px solid #fdba74;color:#7c2d12;border-radius:12px;padding:16px;margin-bottom:18px;font-weight:650}table{width:100%;border-collapse:collapse;background:#fff}th{background:#2b2b2b;color:#fff;text-align:left;padding:12px;font-size:12px}td{padding:13px;border-bottom:1px solid var(--line);vertical-align:top}.open{color:#0563c1;font-weight:800;cursor:pointer;text-decoration:underline}.pill{padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800}.keep{background:#dcfce7;color:#166534}.watch{background:#fef3c7;color:#92400e}.account-head{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:12px}.meta{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px}.meta small{display:block;color:var(--muted);font-weight:700}.meta strong{display:block;margin-top:6px}.section-title{background:var(--red);color:#fff;padding:10px 14px;font-weight:800;border-radius:8px 8px 0 0}.section-body{background:#fff;border:1px solid var(--line);border-top:0;padding:18px;border-radius:0 0 8px 8px;margin-bottom:18px;line-height:1.5}
</style></head><body>
<header><h1>External Monitor</h1></header><nav><button id="portfolioTab" class="active" onclick="showView('portfolio')">Portfolio View</button><button id="accountTab" onclick="showView('account')">Account View</button></nav>
<main><section id="portfolio" class="view active"><div class="toolbar"><div class="field"><label>Scope</label><select id="scope"><option></option></select></div></div><div class="kpis"><div class="kpi"><small>Accounts</small><strong id="accounts"></strong></div><div class="kpi"><small>Internal Data</small><strong id="internal"></strong></div><div class="kpi"><small>Enriched</small><strong id="enriched"></strong></div><div class="kpi"><small>KEEP / WATCH</small><strong id="dispositions"></strong></div><div class="kpi"><small>Highest Score</small><strong id="highest"></strong></div></div><div id="summary" class="summary"></div><div class="panel"><table><thead><tr><th>Account</th><th>Region</th><th>Pod</th><th>Signal Score</th><th>Signals</th><th>Top Reason</th><th>Enrichment</th><th></th></tr></thead><tbody id="portfolioRows"></tbody></table></div></section>
<section id="account" class="view"><div class="toolbar"><div class="field"><label>Selected Account</label><select id="accountSelect" onchange="renderAccount()"></select></div></div><div class="account-head" id="accountMeta"></div><div class="section-title">30-Second Summary</div><div class="section-body" id="accountSummary"></div><div class="section-title">Recommended Next Move</div><div class="section-body" id="accountMove"></div><div class="panel"><table><thead><tr><th>Disposition</th><th>Score</th><th>Headline</th><th>Why It Matters</th><th>Recommended Action</th><th>Source</th></tr></thead><tbody id="signalRows"></tbody></table></div></section></main>
<script id="portfolio-data" type="application/json">__PORTFOLIO_JSON__</script><script>
const data=JSON.parse(document.getElementById('portfolio-data').textContent);const accounts=data.accounts||[];function showView(v){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById(v).classList.add('active');document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));document.getElementById(v+'Tab').classList.add('active')}function openAccount(id){document.getElementById('accountSelect').value=id;renderAccount();showView('account')}function renderPortfolio(){document.getElementById('scope').innerHTML=`<option>${data.scope.type}: ${data.scope.value}</option>`;document.getElementById('accounts').textContent=data.summary.account_count;document.getElementById('internal').textContent=data.summary.accounts_with_internal_data;document.getElementById('enriched').textContent=data.summary.accounts_enriched;document.getElementById('dispositions').textContent=`${data.summary.keep_count} / ${data.summary.watch_count}`;document.getElementById('highest').textContent=data.summary.highest_signal_score??'—';document.getElementById('summary').textContent=data.summary.text;const body=document.getElementById('portfolioRows');body.innerHTML='';accounts.forEach(a=>{const tr=document.createElement('tr');tr.innerHTML=`<td><strong>${a.account_name}</strong></td><td>${a.hierarchy.region??''}</td><td>${a.hierarchy.pod??''}</td><td>${a.signal_score??'—'}</td><td>${a.signals.length}</td><td>${(a.priority_reasons||[])[0]??''}</td><td>${a.identity.match_status}</td><td class="open" onclick="openAccount('${a.account_id}')">Open</td>`;body.appendChild(tr)})}function renderAccount(){const a=accounts.find(x=>x.account_id===document.getElementById('accountSelect').value)||accounts[0];if(!a)return;document.getElementById('accountMeta').innerHTML=`<div class="meta"><small>Account</small><strong>${a.account_name}</strong></div><div class="meta"><small>Region</small><strong>${a.hierarchy.region??''}</strong></div><div class="meta"><small>Pod</small><strong>${a.hierarchy.pod??''}</strong></div><div class="meta"><small>Signal Score</small><strong>${a.signal_score??'—'}</strong></div><div class="meta"><small>Match</small><strong>${a.identity.match_status}</strong></div>`;document.getElementById('accountSummary').textContent=a.summary??'';document.getElementById('accountMove').textContent=a.recommended_next_move??'';const body=document.getElementById('signalRows');body.innerHTML='';(a.signals||[]).forEach(s=>{const tr=document.createElement('tr');tr.innerHTML=`<td><span class="pill ${s.disposition.toLowerCase()}">${s.disposition}</span></td><td>${s.score}</td><td><strong>${s.headline}</strong></td><td>${s.why_it_matters??''}</td><td>${s.recommended_action??''}</td><td>${s.source_url?`<a href="${s.source_url}" target="_blank">Open</a>`:s.source_type}</td>`;body.appendChild(tr)})}const select=document.getElementById('accountSelect');accounts.forEach(a=>{const o=document.createElement('option');o.value=a.account_id;o.textContent=a.account_name;select.appendChild(o)});renderPortfolio();renderAccount();
</script></body></html>
